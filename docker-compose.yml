services:
  mysql:
    image: mysql:8.0
    container_name: qring-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "1234"
      MYSQL_DATABASE: qring_db
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # 호스트 3307 → 컨테이너 3306. 로컬에 설치된 MySQL(3306)과 충돌 피하기 위함.
      - "3307:3306"
    volumes:
      - qring_mysql_data:/var/lib/mysql
      # SQL 시드가 필요하면 호스트의 sql/ 폴더를 컨테이너에서 수동 실행:
      #   docker exec -i qring-mysql mysql -uroot -p1234 qring_db < sql/qring_full_v2.sql
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p1234"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qring-backend
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      # MAIL_USERNAME / MAIL_PASSWORD / OAuth 키 / JWT_SECRET / QRING_EMAIL_DEV_MODE 등 주입
      - .env
    environment:
      # application.yml의 localhost:3306 대신 도커 네트워크의 mysql 서비스로 오버라이드
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/qring_db?serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "1234"
    ports:
      - "8080:8080"

  # ---------------------------------------------------------------
  # frontend (React Native + Expo) — 작성 예시 (실제 코드 머지 후 활성화)
  # ---------------------------------------------------------------
  # frontend 코드가 ./frontend 폴더에 들어오면 아래 service 블록의
  # 주석을 풀고, ./frontend/Dockerfile 도 아래 예시대로 작성하면 됨.
  # profiles 로 묶어둬서 평소엔 무시되고, 다음 명령으로만 기동:
  #   docker compose --profile frontend up -d frontend
  #
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: qring-frontend
  #   profiles: ["frontend"]
  #   ports:
  #     - "8081:8081"     # Metro bundler
  #     - "19000:19000"   # Expo Dev Server
  #     - "19001:19001"   # Expo Dev Tools
  #     - "19002:19002"   # Expo Manifest
  #   environment:
  #     # Expo Go 앱이 LAN으로 접속할 호스트 IP. .env 에 PC 의 사설 IP 지정.
  #     #   REACT_NATIVE_PACKAGER_HOSTNAME=192.168.x.x
  #     REACT_NATIVE_PACKAGER_HOSTNAME: ${REACT_NATIVE_PACKAGER_HOSTNAME:-localhost}
  #     # 백엔드 API 주소를 프론트에서 참조할 때 사용 (.env 또는 frontend 코드에서)
  #     EXPO_PUBLIC_API_BASE_URL: http://${REACT_NATIVE_PACKAGER_HOSTNAME:-localhost}:8080
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules    # 컨테이너 내부 node_modules 보존 (호스트 마운트 덮어쓰기 방지)
  #   stdin_open: true
  #   tty: true
  #
  # ---- ./frontend/Dockerfile 예시 ----
  # FROM node:20-alpine
  # WORKDIR /app
  # COPY package.json package-lock.json* ./
  # RUN npm install
  # COPY . .
  # EXPOSE 8081 19000 19001 19002
  # CMD ["npm", "start"]
  # ---------------------------------------------------------------

volumes:
  qring_mysql_data:
