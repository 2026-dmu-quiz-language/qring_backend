services:


  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qring-backend

    env_file:
      # MAIL_USERNAME / MAIL_PASSWORD / OAuth 키 / JWT_SECRET / QRING_EMAIL_DEV_MODE 등 주입
      - .env

    ports:
      - "8080:8080"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: qring-cloudflared
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - backend
    restart: unless-stopped

  # ---------------------------------------------------------------
  # frontend (Expo Web · nginx 정적 서빙) — 코드 머지 후 주석 해제
  # ---------------------------------------------------------------
  # 통합 절차/Dockerfile/nginx.conf 예시는 ./frontend/README.md 참고.
  # 활성화 시:
  #   1) ./frontend/ 에 프론트 소스 + Dockerfile + nginx.conf 배치
  #   2) 아래 frontend 서비스 블록 주석 해제
  #   3) cloudflared/config.yml 의 ingress service 를
  #      http://backend:8080 → http://frontend:80 으로 변경
  #   4) docker compose up -d --build
  #
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #     args:
  #       EXPO_PUBLIC_API_BASE_URL: /api
  #   container_name: qring-frontend
  #   ports:
  #     - "80:80"
  #   depends_on:
  #     - backend
  #   restart: unless-stopped
  # ---------------------------------------------------------------


