spring:
  datasource:
    url: jdbc:mysql://qring.c72ooi4qiyuu.ap-northeast-2.rds.amazonaws.com:3306/qring_db?serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=utf8
    username: admin
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        hbm2ddl:
          # story_session 테이블은 DB 담당 팀원이 직접 생성 — 자동 생성에서 제외
          schema_filter_provider: com.qring.qring_backend.config.StorySchemaFilterProvider
    generate-ddl: true

  sql:
    init:
      # data.sql 은 더 이상 사용하지 않는다. AWS RDS 를 대상으로 매 기동마다
      # 스크립트가 실행되면 안 되므로 반드시 never 로 유지할 것.
      mode: never
      encoding: UTF-8

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: 8080
  base-url: http://localhost:8080

jwt:
  secret: ${JWT_SECRET:qring-default-secret-key-please-change-in-production-min-32-bytes}
  access-token-validity-ms: 3600000
  refresh-token-validity-ms: 1209600000

qring:
  email:
    # true 이면 실제 메일 전송 없이 로그에만 인증 코드를 출력 (로컬/데모용)
    dev-mode: ${QRING_EMAIL_DEV_MODE:false}
    # 가입·check-email 시 이메일 도메인의 DNS MX 레코드 실존 여부 검증 (로컬/CI 에서는 끌 수 있음)
    dns-check:
      enabled: ${QRING_EMAIL_DNS_CHECK:true}
      timeout-ms: 2000        # 1회 질의 타임아웃
      retries: 1
      cache-ttl-valid: 24h    # MX 있음 판정 캐시
      cache-ttl-invalid: 1h   # MX 없음 판정 캐시 (DNS 를 막 고친 도메인이 오래 막히지 않게 짧게)
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4.1-mini}   # 하위 호환: tiers.standard.model 의 기본값으로 쓰인다
    # 인터랙티브 스토리 모델 티어 (설계: INTERACTIVE_STORY_MODEL_TIER_DESIGN.md).
    # 가격의 원본은 여기이며 프론트는 같은 값을 하드코딩한다 (조회 API 없음, 팀 결정 2026-09-16).
    tiers:
      standard:
        model: ${OPENAI_MODEL_STANDARD:${qring.openai.model}}
        start-cost: 400
        extend-cost: 100
      premium:
        model: ${OPENAI_MODEL_PREMIUM:gpt-4.1}
        start-cost: 550     # 기본 400 + 업그레이드 150
        extend-cost: 100    # 프리미엄 인상 여부는 팀 논의 후 결정 (보류)
  story:
    guard:
      # 인터랙티브 스토리 입력의 최소 안전장치 (StoryContentGuard).
      # 프롬프트 인젝션·내부 JSON 필드 조작만 막고, 제조법 요구는 세션 시작 입력에서만 본다.
      # 갈등·범죄 소재 자체는 막지 않는다 (내용 판단은 OpenAI 가드레일에 맡김).
      # 오탐이 보이면 false 로 즉시 끌 수 있다.
      enabled: ${QRING_STORY_GUARD:true}
  push:
    # 푸시 알림 (설계: PUSH_NOTIFICATION_DESIGN.md).
    # false 면 발송기를 등록하지 않고 발송 내용을 로그로만 출력한다 (로컬/CI 기본값).
    enabled: ${QRING_PUSH_ENABLED:false}
    # 푸시 발송 제공자: expo (기본값) 또는 fcm
    provider: ${QRING_PUSH_PROVIDER:expo}
    firebase:
      # FCM 사용 시 서비스 계정 키. 둘 중 하나만 채운다 — 파일 경로 또는 JSON 원문(base64 도 허용).
      credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
      credentials-json: ${FIREBASE_CREDENTIALS_JSON:}
    wrong-answer-reminder:
      # 오답 생성 N일차 알림. 매일 cron 시각(Asia/Seoul)에 "오늘 - days-after" 날짜에 생긴 오답이
      # 아직 남아 있는(다시 풀지 않은) 사용자에게 1회 발송한다. 7일이 지나면 오답 노트에서 사라지므로 하루 전 알림.
      enabled: ${QRING_PUSH_WRONG_ANSWER_REMINDER_ENABLED:true}
      cron: ${QRING_PUSH_WRONG_ANSWER_REMINDER_CRON:0 0 20 * * *}
      days-after: 6
  admin:
    # 관리자 전용 API(/admin/**) 허용 userId 목록 (쉼표 구분). 비어 있으면 아무도 접근 불가.
    user-ids: ${ADMIN_USER_IDS:}

oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  kakao:
    app-key: ${KAKAO_APP_KEY:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
  line:
    channel-id: ${LINE_CHANNEL_ID:}
    channel-secret: ${LINE_CHANNEL_SECRET:}
