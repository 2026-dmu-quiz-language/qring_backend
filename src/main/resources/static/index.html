<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qring — 영어가 자연스럽게 스며드는 시간</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary:   #6F9F63;
      --secondary: #AAB87B;
      --tertiary:  #B7A07A;
      --neutral:   #E9E9DB;
      --ink:       #2F3A2A;
      --ink-soft:  #5B6452;
      --white:     #FFFFFF;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: var(--neutral);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      line-height: 1.6;
      position: relative;
      overflow-x: hidden;
    }

    body::before, body::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      z-index: 0;
      pointer-events: none;
    }
    body::before {
      width: 380px; height: 380px;
      background: var(--secondary);
      top: -120px; left: -120px;
    }
    body::after {
      width: 320px; height: 320px;
      background: var(--tertiary);
      bottom: -100px; right: -100px;
    }

    .card {
      position: relative;
      z-index: 1;
      background: var(--white);
      max-width: 560px;
      width: 100%;
      border-radius: 28px;
      padding: 56px 48px;
      box-shadow: 0 20px 60px rgba(47, 58, 42, 0.08);
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: rgba(111, 159, 99, 0.12);
      color: var(--primary);
      border-radius: 999px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 24px;
    }
    .badge .dot {
      width: 8px; height: 8px;
      background: var(--primary);
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.3); }
    }

    .logo {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 4rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--primary);
      margin-bottom: 12px;
      line-height: 1;
    }
    .logo .accent { color: var(--tertiary); }

    .tagline {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 12px;
    }

    .description {
      font-family: 'Be Vietnam Pro', sans-serif;
      color: var(--ink-soft);
      font-size: 0.98rem;
      margin-bottom: 36px;
      max-width: 420px;
      margin-left: auto;
      margin-right: auto;
    }

    .domain-tag {
      display: inline-block;
      padding: 8px 18px;
      background: var(--neutral);
      border: 1.5px solid var(--secondary);
      border-radius: 999px;
      font-family: 'Plus Jakarta Sans', monospace;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 36px;
    }

    .links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 12px 24px;
      border-radius: 12px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }
    .btn-primary {
      background: var(--primary);
      color: var(--white);
      box-shadow: 0 4px 14px rgba(111, 159, 99, 0.35);
    }
    .btn-primary:hover {
      background: #5E8B53;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(111, 159, 99, 0.45);
    }
    .btn-ghost {
      background: transparent;
      color: var(--tertiary);
      border: 1.5px solid var(--tertiary);
    }
    .btn-ghost:hover {
      background: var(--tertiary);
      color: var(--white);
      transform: translateY(-2px);
    }

    footer {
      position: relative;
      z-index: 1;
      margin-top: 32px;
      font-family: 'Be Vietnam Pro', sans-serif;
      font-size: 0.82rem;
      color: var(--ink-soft);
      opacity: 0.7;
    }

    @media (max-width: 480px) {
      .card { padding: 40px 28px; border-radius: 24px; }
      .logo { font-size: 3rem; }
      .tagline { font-size: 1.05rem; }
      .description { font-size: 0.92rem; }
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">
      <span class="dot"></span>
      서버 정상 동작 중
    </span>

    <h1 class="logo">Q<span class="accent">ring</span></h1>
    <p class="tagline">영어가 자연스럽게 스며드는 시간</p>
    <p class="description">
      재미있는 이야기를 따라가며 영어 표현을 익혀보세요.<br/>
      Qring과 함께라면, 학습이 아니라 일상이 됩니다.
    </p>

    <div class="domain-tag">https://q-ring.app</div>

    <div class="links">
      <a class="btn btn-primary" href="/swagger-ui/index.html">
        API 문서 둘러보기
      </a>
      <a class="btn btn-ghost" href="/v3/api-docs">
        OpenAPI JSON
      </a>
    </div>
  </main>

  <footer>
    © 2026 Qring · Made with care
  </footer>
</body>
</html>
